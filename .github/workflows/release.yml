name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/comit
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distributions
        run: |
          python -m build

      - name: Verify package metadata
        run: |
          python -c "import glob, subprocess, sys; files = glob.glob('dist/*'); sys.exit('No distribution files found in dist/') if not files else sys.exit(subprocess.call([sys.executable, '-m', 'twine', 'check', '--strict'] + files))"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
