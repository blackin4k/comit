[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comit"
version = "0.1.0"
description = "An AI-powered Git commit assistant that understands your repository's commit style"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Comit Team" }
]
keywords = ["git", "commit", "ai", "cli", "groq", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
test = [
    "pytest>=7.0.0",
]
tests = [
    "pytest>=7.0.0",
]
gemini = [
    "google-genai>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
ollama = [
    "ollama>=0.3.0",
]
all = [
    "groq>=0.9.0",
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "ollama>=0.3.0",
]

[project.scripts]
comit = "comit.cli:app"
git-ai = "comit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
